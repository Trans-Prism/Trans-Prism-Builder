name: Sync Builder Release to R2

on:
  workflow_dispatch: # 手动触发测试
  workflow_run:
    workflows: ["OTA Builder - Oyama's HRT Tracker", "OTA Builder - TransMTF HRT Tracker", "OTA Builder - FtM", "OTA Builder - MioMtF", "OTA Builder - MtF", "OTA Builder - RLE"]
    types:
      - completed

jobs:
  mirror-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🗂️ 检出代码库
        uses: actions/checkout@v4

      - name: 🚀 按分类精准拉取、生成索引并同步
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 定义我们要维护的 6 大项目前缀
          PROJECTS=("tracker" "transmtf_tracker" "mtf" "ftm" "rle" "miomtfwiki")
          
          for proj in "${PROJECTS[@]}"; do
            echo "========================================"
            echo "🔍 正在检索分类: $proj"
            
            # 使用 jq 精准过滤出以该前缀开头的【最新一个】 Tag
            # sync 随构建触发，刚构建完的最新 Release 一定在最近记录中。
            # 只取 30 条足够覆盖，避免扫描太多老 Release 平添 R2 同步成本。
            LATEST_TAG=$(gh release list --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("'"$proj"'"))] | .[0].tagName')
            
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "⚠️ 未找到 $proj 的历史发布记录，跳过。"
              continue
            fi
            
            echo "✅ 找到 $proj 的最新版本: $LATEST_TAG"
            
            # 清理临时目录并下载
            rm -rf release_assets
            mkdir release_assets
            gh release download "$LATEST_TAG" --dir release_assets
            
            # 1. 归档到带版本号的 releases/ 目录
            aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$LATEST_TAG/ --endpoint-url ${{ secrets.R2_ENDPOINT }}
            
            # 2. 🧹 核心修复：清理 /latest/ 目录下的旧同类文件
            # 删掉所有含有该前缀的 .zip 文件，防止文件名带有不同日期导致堆积
            echo "正在清理 /latest/ 目录中的旧版 $proj..."
            # 注意 tracker 的文件名是 hrt_tracker_update-*.zip，用 tracker*.zip 匹配不上
            CLEAN_GLOB="$proj*.zip"
            if [ "$proj" = "tracker" ]; then CLEAN_GLOB="hrt_tracker_update-*.zip"; fi
            aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/builder/latest/ --recursive --exclude "*" --include "$CLEAN_GLOB" --endpoint-url ${{ secrets.R2_ENDPOINT }}
            
            # 3. 📝 生成 Vibe 客户端需要的 latest.json
            # 提取刚下载的 zip 文件名
            FILENAME=$(ls release_assets | grep .zip | head -n 1)
            # 生成 JSON，格式如 {"latest_file": "mtf-wiki-2026.zip", "tag": "mtf-2026", "update_time": "..."}
            echo "{\"latest_file\": \"$FILENAME\", \"tag\": \"$LATEST_TAG\", \"update_time\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > release_assets/${proj}_latest.json
            
            # 4. 同步新的文件和对应的 json 到 /latest/
            aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/latest/ --endpoint-url ${{ secrets.R2_ENDPOINT }}

            # 5. 🧹 R2 归档只留两版：最新 + 上一个（省免费额度）
            # 以 GitHub Release 新旧排序为准（gh release list 默认最新在前），
            # 第 3 个起的旧 tag 对应 R2 目录直接删；R2 上残留的孤儿目录也一并清理。
            echo "正在清理 $proj 的旧归档，只保留最新两版..."
            ALL_TAGS=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("'"$proj"'"))] | .[].tagName')
            echo "$ALL_TAGS" | tail -n +3 | while read -r OLD_TAG; do
              [ -z "$OLD_TAG" ] && continue
              echo "删除旧归档: builder/releases/$OLD_TAG/"
              aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$OLD_TAG/ --recursive --endpoint-url ${{ secrets.R2_ENDPOINT }}
            done
            KEEP1=$(echo "$ALL_TAGS" | sed -n '1p')
            KEEP2=$(echo "$ALL_TAGS" | sed -n '2p')
            R2_DIRS=$(aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/ --endpoint-url ${{ secrets.R2_ENDPOINT }} | awk '{print $2}' | tr -d '/' | grep "^${proj}" || true)
            for d in $R2_DIRS; do
              if [ "$d" != "$KEEP1" ] && [ "$d" != "$KEEP2" ]; then
                echo "删除孤儿归档: builder/releases/$d/"
                aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$d/ --recursive --endpoint-url ${{ secrets.R2_ENDPOINT }}
              fi
            done
            
          done
