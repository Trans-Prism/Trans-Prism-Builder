name: Sync Builder Release to R2

on:
  release:
    types: [published]

jobs:
  mirror-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下载离线数据包附件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release_assets
          echo "正在拉取数据版本: ${{ github.event.release.tag_name }}"
          # gh CLI 会自动抓取 Release 下所有的 zip 和 json
          gh release download ${{ github.event.release.tag_name }} --dir release_assets
          
      - name: 🔑 配置 Cloudflare R2 密钥
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: 🚀 同步至 R2 (/builder/ 命名空间)
        run: |
          # 归档该批次的数据包至对应版本号目录
          aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/${{ github.event.release.tag_name }}/ --endpoint-url ${{ secrets.R2_ENDPOINT }}
          # 覆盖最新版资源目录
          aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/latest/ --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: 🧹 清理 R2 历史离线包 (仅保留最近 5 个)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 严格提取 GitHub 最新 5 次发布记录
          LATEST_TAGS=$(gh api repos/${{ github.repository }}/releases --jq '.[0:5] | .[].tag_name')
          echo "受保护的数据包版本: $LATEST_TAGS"
          
          # 遍历 R2 专属命名空间
          S3_DIRS=$(aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/ --endpoint-url ${{ secrets.R2_ENDPOINT }} | awk '{print $2}' | sed 's/\///')
          
          for dir in $S3_DIRS; do
            if ! echo "$LATEST_TAGS" | grep -qx "$dir"; then
              echo "🗑️ 空间保护触发，销毁过期数据包: $dir"
              aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$dir/ --recursive --endpoint-url ${{ secrets.R2_ENDPOINT }}
            fi
          done
