name: Sync Builder Release to R2

on:
  release:
    types: [published]
  workflow_dispatch: # 🚀 恢复为无需输入的纯净点击按钮

jobs:
  mirror-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🗂️ 检出代码库 (获取 Git 上下文)
        uses: actions/checkout@v4

      - name: 🚀 批量拉取并同步至 R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "手动触发机制：将自动抓取最新的 5 个 Release..."
            # 获取最新的 5 个 Tag/Hash
            TARGET_TAGS=$(gh api repos/${{ github.repository }}/releases --jq '.[0:5] | .[].tag_name')
          else
            echo "自动发布机制：仅处理本次触发的 Release..."
            TARGET_TAGS="${{ github.event.release.tag_name }}"
          fi
          
          # 开始循环处理每个版本
          for tag in $TARGET_TAGS; do
            echo "----------------------------------------"
            echo "📦 正在处理版本: $tag"
            
            # 清空并重建临时下载目录，防止不同版本文件混淆
            rm -rf release_assets
            mkdir release_assets
            
            # 下载该 tag 的所有附件
            gh release download "$tag" --dir release_assets
            
            # 归档该批次的数据包至对应 Hash/Tag 目录
            aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$tag/ --endpoint-url ${{ secrets.R2_ENDPOINT }}
            
            # 覆盖更新最新版资源目录
            aws s3 sync release_assets s3://${{ secrets.R2_BUCKET_NAME }}/builder/latest/ --endpoint-url ${{ secrets.R2_ENDPOINT }}
          done

      - name: 🧹 清理 R2 历史离线包 (仅保留最近 5 个)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          LATEST_TAGS=$(gh api repos/${{ github.repository }}/releases --jq '.[0:5] | .[].tag_name')
          echo "受保护的数据包版本: $LATEST_TAGS"
          
          S3_DIRS=$(aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/ --endpoint-url ${{ secrets.R2_ENDPOINT }} | awk '{print $2}' | sed 's/\///')
          
          for dir in $S3_DIRS; do
            if ! echo "$LATEST_TAGS" | grep -qx "$dir"; then
              echo "🗑️ 空间保护触发，销毁过期数据包: $dir"
              aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/builder/releases/$dir/ --recursive --endpoint-url ${{ secrets.R2_ENDPOINT }}
            fi
          done
