name: OTA Builder - TransMTF HRT Tracker

on:
  schedule:
    # ⏱️ 每天北京时间凌晨 3:30 (19:30 UTC) 执行 — 接在 Oyama Tracker（03:00）之后错峰
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  build-transmtf-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Builder Repo
      uses: actions/checkout@v4

    - name: Check Upstream Hash
      id: check
      run: |
        UPSTREAM_URL="https://github.com/TransmtfTeam/Transmtf-HRT-Tracker.git"
        LATEST_HASH=$(git -c credential.helper= ls-remote $UPSTREAM_URL HEAD | awk '{print $1}')

        LOCAL_HASH=""
        if [ -f "transmtf_tracker/last_sync_hash.txt" ]; then
          LOCAL_HASH=$(cat transmtf_tracker/last_sync_hash.txt)
        fi

        echo "LATEST_HASH=$LATEST_HASH" >> $GITHUB_ENV
        echo "LATEST_HASH=$LATEST_HASH" >> $GITHUB_OUTPUT

        if [ "$LATEST_HASH" == "$LOCAL_HASH" ]; then
          echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
        else
          echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
        fi

    - name: Set up Node.js
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clone Upstream Tracker (Source Files)
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        git clone --depth 1 https://github.com/TransmtfTeam/Transmtf-HRT-Tracker.git official-source

    - name: Scaffold Fresh Vite Project (avoid import map CDN issue)
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        # Per upstream README: create clean Vite project, install deps, copy source
        npm create vite@latest offline-build -- --template react-ts
        cd offline-build
        npm install
        npm install recharts lucide-react uuid @types/uuid clsx tailwind-merge

    - name: Copy Upstream Source into Fresh Project
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        # Upstream has index.tsx at root importing './src/...' 
        # We preserve this structure: index.tsx at root, src/ below it

        # 1. Remove scaffold src/ contents
        rm -rf offline-build/src/*

        # 2. Copy upstream's src/ (components, pages, contexts, etc.)
        cp -r official-source/src/* offline-build/src/

        # 3. Copy upstream's entry point to root (keeps './src/...' imports valid)
        cp official-source/index.tsx offline-build/index.tsx

        # 4. Copy root-level source files to PROJECT ROOT (upstream has logic.ts/pk.ts at root)
        cp official-source/logic.ts offline-build/
        cp official-source/pk.ts offline-build/
        cp official-source/personalModel.ts offline-build/
        cp official-source/calibration.ts offline-build/
        cp official-source/types.ts offline-build/
        cp official-source/worker.ts offline-build/
        cp official-source/mipd.ts offline-build/

        # 5. ALSO copy all root-level source files into src/
        #    - src/components/* uses ../logic → src/logic.ts
        #    - src/logic.ts uses ./types, ./pk, ./calibration, ./personalModel, ./mipd → src/
        cp official-source/logic.ts offline-build/src/logic.ts
        cp official-source/pk.ts offline-build/src/pk.ts
        cp official-source/personalModel.ts offline-build/src/personalModel.ts
        cp official-source/calibration.ts offline-build/src/calibration.ts
        cp official-source/types.ts offline-build/src/types.ts
        cp official-source/mipd.ts offline-build/src/mipd.ts

        # 6. Copy public assets (favicon etc.)
        cp -r official-source/public/* offline-build/public/ 2>/dev/null || true

    - name: Inject Offline Configuration
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      shell: python
      run: |
        import os, re

        build_dir = "offline-build"

        # ── 1. Rewrite index.html ──
        # Change entry from ./src/main.tsx → ./index.tsx (upstream structure)
        # Remove any import map or CDN scripts (scaffold may not have them, but be safe)
        index_path = os.path.join(build_dir, "index.html")
        with open(index_path, "r", encoding="utf-8") as f:
            html = f.read()

        # Update module entry to point to index.tsx (handle both ./src/main.tsx and /src/main.tsx)
        html = html.replace('./src/main.tsx', './index.tsx')
        html = html.replace('/src/main.tsx', '/index.tsx')

        # Remove any import map (safety cleanup)
        html = re.sub(
            r'\s*<script type="importmap">.*?</script>\s*',
            '\n',
            html,
            flags=re.DOTALL | re.IGNORECASE,
        )
        # Remove CDN scripts (scaffold won't have this, but upstream index.html did)
        html = re.sub(
            r'<script[^>]*src="https://cdn\.tailwindcss\.com[^"]*"[^>]*></script>\s*',
            '',
            html,
            flags=re.IGNORECASE,
        )

        with open(index_path, "w", encoding="utf-8") as f:
            f.write(html)
        print("index.html: entry → ./index.tsx, CDN/importmap stripped")

        # ── 2. Inject base: './' into vite.config.ts ──
        vite_path = os.path.join(build_dir, "vite.config.ts")
        with open(vite_path, "r", encoding="utf-8") as f:
            content = f.read()
        if "base:" not in content:
            content = content.replace("defineConfig({", "defineConfig({\n  base: './',", 1)
            with open(vite_path, "w", encoding="utf-8") as f:
                f.write(content)
            print("vite.config.ts: injected base: './'")
        else:
            print("vite.config.ts: base already configured")

        # ── 3. Remove VitePWA plugin if present (scaffold won't have it) ──
        content_orig = content
        content = re.sub(
            r"import\s+.*VitePWA.*from\s+['\"].*['\"];?\s*",
            "",
            content,
        )
        content = re.sub(
            r",?\s*VitePWA\(\{.*?\}\)\s*",
            "",
            content,
            flags=re.DOTALL,
        )
        if content != content_orig:
            with open(vite_path, "w", encoding="utf-8") as f:
                f.write(content)
            print("vite.config.ts: stripped VitePWA plugin")
        else:
            print("vite.config.ts: no PWA plugin to strip")

        print("Offline configuration complete")

    - name: Build Offline Bundle
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        cd offline-build
        npx vite build

    - name: Package Dist
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        RELEASE_DATE=$(date -d "+8 hours" +%Y-%m-%d)
        echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV

        cd offline-build/dist
        zip -r ../../transmtf_tracker_update-$RELEASE_DATE.zip *
        cd ../..

    - name: Create GitHub Release
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_DATE: ${{ env.RELEASE_DATE }}
      run: |
        TAG_NAME="transmtf_tracker-${RELEASE_DATE}"
        gh release create "$TAG_NAME" transmtf_tracker_update-${RELEASE_DATE}.zip \
          --title "TransMTF Tracker 自动构建版 $TAG_NAME" \
          --notes "🤖 上游同步 Hash: \`${{ env.LATEST_HASH }}\`"

    - name: Commit Sync Log
      if: steps.check.outputs.HAS_CHANGES == 'true'
      run: |
        mkdir -p transmtf_tracker
        echo ${{ env.LATEST_HASH }} > transmtf_tracker/last_sync_hash.txt

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git fetch origin ${{ github.ref_name }}
        git reset --soft FETCH_HEAD

        git add transmtf_tracker/last_sync_hash.txt
        git commit -m "📝 chore(transmtf_tracker): 自动更新 TransMTF tracker 指纹日志" || echo "无新日志需要提交"
        git push origin HEAD:${{ github.ref_name }}
